<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Estética & Barbería</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #1f1f1f, #3a3a3a); color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #262626; width: 100%; max-width: 450px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-top: 5px solid #25d366; }
        h2 { text-align: center; margin-bottom: 5px; }
        p { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #ddd; }
        input, select { width: 100%; padding: 10px; border: 1px solid #444; background: #333; color: #fff; border-radius: 8px; font-size: 13px; outline: none; }
        input:focus, select:focus { border-color: #25d366; }
        .btn-whatsapp { width: 100%; background-color: #25d366; color: white; border: none; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; }
        .btn-whatsapp:hover { background-color: #1ebe5d; }
        .btn-whatsapp svg { width: 18px; height: 18px; fill: white; }
        #loading { display: none; text-align: center; color: #25d366; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Agendar Cita</h2>
        <p>Estética & Barbería Style</p>

        <form id="appointmentForm">
            <div class="form-group">
                <label for="name">Nombre y Apellido:</label>
                <input type="text" id="name" required placeholder="Ej. Carlos Pérez">
            </div>
            <div class="form-group">
                <label for="service">Servicio:</label>
                <select id="service" required>
                    <option value="" disabled selected>-- Elige un servicio --</option>
                    <optgroup label="Barbería">
                        <option value="Corte de Cabello Clásico">Corte de Cabello Clásico</option>
                        <option value="Corte + Barba">Corte + Barba</option>
                        <option value="Arreglo de Barba">Arreglo de Barba</option>
                    </optgroup>
                    <optgroup label="Estética">
                        <option value="Corte Dama / Brushing">Corte Dama / Brushing</option>
                        <option value="Tintura / Coloración">Tintura / Coloración</option>
                        <option value="Manicure / Pedicure">Manicure / Pedicure</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Fecha:</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="time">Hora:</label>
                <input type="time" id="time" required>
            </div>
            <button type="button" class="btn-whatsapp" onclick="enviarCita()">
                <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.52 0-10 4.48-10 10 0 1.77.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.52 0 10-4.48 10-10s-4.48-10-10-10zm5.83 14.39c-.24.67-1.39 1.29-1.92 1.37-.51.08-1.16.12-3.74-.9-3.15-1.25-5.2-4.47-5.36-4.68-.16-.21-1.28-1.71-1.28-3.26 0-1.55.81-2.31 1.1-2.62.29-.31.63-.39.84-.39.21 0 .42 0 .6.01.19.01.44-.07.69.53.25.6.86 2.11.93 2.27.08.16.13.35.03.56-.1.21-.15.34-.3.52-.15.18-.32.4-.46.54-.15.15-.31.31-.13.61.18.3 1.05 1.73 2.25 2.8 1.55 1.38 2.86 1.81 3.27 2.01.41.2.65.17.89-.1.24-.27 1.03-1.2 1.3-1.61.27-.41.54-.34.91-.21.37.13 2.34 1.1 2.74 1.3.4.2.67.3.77.46.1.16.1.94-.14 1.61z"/></svg>
                Agendar y Notificar por WhatsApp
            </button>
            <div id="loading">Enviando solicitud a la nube...</div>
        </form>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzx0U40K76i-57SuzOoZjdXwLNT_RNyckwYPsy8i0K7gUYDyQ_XSk23qoCH3vpFNOTTZA/exec"; 
        const MI_TELEFONO = "5213511043239"; // Tu número de WhatsApp con código de país

        async function enviarCita() {
            const nombre = document.getElementById('name').value;
            const servicio = document.getElementById('service').value;
            const fecha = document.getElementById('date').value;
            const hora = document.getElementById('time').value;

            if (!nombre || !servicio || !fecha || !hora) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            document.getElementById('loading').style.display = 'block';

            const idCita = 'CITA-' + Math.floor(100000 + Math.random() * 900000);
            const datosCita = { id: idCita, nombre, servicio, fecha, hora, estado: 'Pendiente' };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosCita)
                });

                // URL de tu panel de administración desplegado en internet
                const adminURL = "https://josealvarezambriz-bot.github.io/MiEstetica/admin.html";
                const linkGestion = `${adminURL}?id=${idCita}`;

                const mensaje = `¡Hola! Nueva solicitud de cita pendiente.%0A%0A` +
                                `*ID:* ${idCita}%0A` +
                                `*Cliente:* ${nombre}%0A` +
                                `*Servicio:* ${servicio}%0A` +
                                `*Fecha:* ${fecha} a las ${hora}%0A%0A` +
                                `👉 *Gestionar Cita aquí:*%0A${linkGestion}`;

                window.location.href = `https://wa.me/${MI_TELEFONO}?text=${encodeURIComponent(mensaje)}`;
            } catch (error) {
                alert("Error al conectar con la nube. Inténtalo de nuevo.");
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
