<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Giors Estética & Barbería</title>
    <!-- Fuente moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root {
            --bg-color: #e0e5ec;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --card-bg: #e0e5ec;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --danger: #ef4444;
            --success: #10b981;
            
            --shadow-outset: 6px 6px 12px #bec8d4, -6px -6px 12px #ffffff;
            --shadow-inset: inset 6px 6px 12px #bec8d4, inset -6px -6px 12px #ffffff;
            
            --font-family: 'Poppins', sans-serif;
        }

        [data-theme="dark"] {
            --bg-color: #1f2937;
            --primary: #60a5fa;
            --primary-dark: #3b82f6;
            --card-bg: #1f2937;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --danger: #f87171;
            --success: #34d399;

            --shadow-outset: 6px 6px 12px #111827, -6px -6px 12px #2d3748;
            --shadow-inset: inset 6px 6px 12px #111827, inset -6px -6px 12px #2d3748;
        }

        [data-theme="oled"] {
            --bg-color: #000000;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --card-bg: #121212;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --danger: #ef4444;
            --success: #10b981;

            --shadow-outset: 5px 5px 10px #050505, -5px -5px 10px #1f1f1f;
            --shadow-inset: inset 5px 5px 10px #050505, inset -5px -5px 10px #1f1f1f; 
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: var(--font-family); 
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Selector de Temas */
        .theme-selector {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            box-shadow: var(--shadow-outset);
        }

        .theme-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-btn.active {
            color: var(--primary);
            box-shadow: var(--shadow-inset);
        }

        .card { 
            background: var(--card-bg); 
            width: 100%; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: var(--shadow-outset); 
            transition: box-shadow 0.3s ease, background-color 0.3s ease;
        }

        /* Estilos del Logo en el Encabezado */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: var(--shadow-outset);
            border: 2px solid rgba(212, 175, 55, 0.3); /* Toque sutil dorado acorde al logo */
        }

        h2 { 
            text-align: center; 
            margin-bottom: 5px; 
            font-weight: 600;
            color: var(--text-primary);
        }

        p { 
            text-align: center; 
            font-size: 13px; 
            color: var(--text-secondary); 
            margin-bottom: 25px; 
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        label { 
            display: block; 
            font-size: 13px; 
            margin-bottom: 8px; 
            color: var(--text-secondary); 
            font-weight: 500;
        }

        input, select { 
            width: 100%; 
            padding: 12px 16px; 
            border: none; 
            background: var(--card-bg); 
            color: var(--text-primary); 
            border-radius: 12px; 
            font-size: 14px; 
            outline: none; 
            box-shadow: var(--shadow-inset);
            transition: color 0.3s ease;
        }

        select option {
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .btn-whatsapp { 
            width: 100%; 
            background-color: #25d366; 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 12px; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            margin-top: 15px; 
            box-shadow: var(--shadow-outset);
            transition: filter 0.2s ease, transform 0.1s ease;
        }

        .btn-whatsapp:hover { 
            filter: brightness(1.05); 
        }

        .btn-whatsapp:active {
            box-shadow: var(--shadow-inset);
            transform: scale(0.98);
        }

        .btn-whatsapp svg { 
            width: 18px; 
            height: 18px; 
            fill: white; 
        }

        #loading { 
            display: none; 
            text-align: center; 
            color: var(--success); 
            font-size: 13px; 
            margin-top: 12px; 
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Selector de temas interactivo -->
        <div class="theme-selector">
            <button class="theme-btn active" onclick="setTheme('light', this)">Claro</button>
            <button class="theme-btn" onclick="setTheme('dark', this)">Oscuro</button>
            <button class="theme-btn" onclick="setTheme('oled', this)">OLED</button>
        </div>

        <div class="card">
            <!-- Logo integrado en el encabezado -->
            <div class="logo-container">
                <img src="logo.png" alt="Giors Logo" class="logo-img">
            </div>

            <h2>Agendar Cita</h2>
            <p>Giors Estética & Barbería Style</p>

            <form id="appointmentForm">
                <div class="form-group">
                    <label for="name">Nombre y Apellido:</label>
                    <input type="text" id="name" required placeholder="Ej. Carlos Pérez">
                </div>
                <div class="form-group">
                    <label for="service">Servicio:</label>
                    <select id="service" required>
                        <option value="" disabled selected>-- Elige un servicio --</option>
                        <optgroup label="Barbería">
                            <option value="Corte de Cabello Clásico">Corte de Cabello Clásico</option>
                            <option value="Corte + Barba">Corte + Barba</option>
                            <option value="Arreglo de Barba">Arreglo de Barba</option>
                        </optgroup>
                        <optgroup label="Estética">
                            <option value="Corte Dama / Brushing">Corte Dama / Brushing</option>
                            <option value="Tintura / Coloración">Tintura / Coloración</option>
                            <option value="Manicure / Pedicure">Manicure / Pedicure</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Fecha:</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="time">Hora:</label>
                    <input type="time" id="time" required>
                </div>
                <button type="button" class="btn-whatsapp" onclick="enviarCita()">
                    <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.52 0-10 4.48-10 10 0 1.77.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.52 0 10-4.48 10-10s-4.48-10-10-10zm5.83 14.39c-.24.67-1.39 1.29-1.92 1.37-.51.08-1.16.12-3.74-.9-3.15-1.25-5.2-4.47-5.36-4.68-.16-.21-1.28-1.71-1.28-3.26 0-1.55.81-2.31 1.1-2.62.29-.31.63-.39.84-.39.21 0 .42 0 .6.01.19.01.44-.07.69.53.25.6.86 2.11.93 2.27.08.16.13.35.03.56-.1.21-.15.34-.3.52-.15.18-.32.4-.46.54-.15.15-.31.31-.13.61.18.3 1.05 1.73 2.25 2.8 1.55 1.38 2.86 1.81 3.27 2.01.41.2.65.17.89-.1.24-.27 1.03-1.2 1.3-1.61.27-.41.54-.34.91-.21.37.13 2.34 1.1 2.74 1.3.4.2.67.3.77.46.1.16.1.94-.14 1.61z"/></svg>
                    Agendar y Notificar por WhatsApp
                </button>
                <div id="loading">Enviando solicitud a la nube...</div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "TU_URL_DE_APPS_SCRIPT_AQUI"; 
        const MI_TELEFONO = "5213511043239";

        function setTheme(theme, button) {
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            button.classList.add('active');
        }

        async function enviarCita() {
            const nombre = document.getElementById('name').value;
            const servicio = document.getElementById('service').value;
            const fecha = document.getElementById('date').value;
            const hora = document.getElementById('time').value;

            if (!nombre || !servicio || !fecha || !hora) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            document.getElementById('loading').style.display = 'block';

            const idCita = 'CITA-' + Math.floor(100000 + Math.random() * 900000);
            const datosCita = { id: idCita, nombre, servicio, fecha, hora, estado: 'Pendiente' };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosCita)
                });

                const adminURL = "https://tu-usuario.github.io/tu-repositorio/admin.html";
                const linkGestion = `${adminURL}?id=${idCita}`;

                const mensaje = `¡Hola! Nueva solicitud de cita pendiente.%0A%0A` +
                                `*ID:* ${idCita}%0A` +
                                `*Cliente:* ${nombre}%0A` +
                                `*Servicio:* ${servicio}%0A` +
                                `*Fecha:* ${fecha} a las ${hora}%0A%0A` +
                                `👉 *Gestionar Cita aquí:*%0A${linkGestion}`;

                window.location.href = `https://wa.me/${MI_TELEFONO}?text=${encodeURIComponent(mensaje)}`;
            } catch (error) {
                alert("Error al conectar con la nube. Inténtalo de nuevo.");
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
